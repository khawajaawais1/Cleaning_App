  <video class="bg-video" autoplay muted loop playsinline>
    <source
      src="assets/backdrop_video/289966.mp4"
      type="video/mp4"
    />
  </video>

  <!-- ── Right form panel ── -->
  <main class="form-panel">
    <video class="bg-video-zoom" autoplay muted loop playsinline>
      <source
        src="assets/backdrop_video/289966.mp4"
        type="video/mp4"
      />
    </video>
    <div class="form-inner">
      <!-- Mobile-only logo -->
      <div class="mobile-logo">
        <div class="bp-mark bp-mark--sm"></div>
        <span>Happy2Clean</span>
      </div>

      <h2 class="form-title"><span>S</span>ign in</h2>
      <p class="form-sub">Enter your admin credentials to continue</p>

      <!-- Error -->
      <div *ngIf="error" class="alert-error" role="alert">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <!-- Email -->
        <div
          class="field"
          [class.field--invalid]="emailCtrl.invalid && emailCtrl.touched"
        >
          <label class="field__label" for="email">Email address</label>
          <div class="field__wrap">
            <svg
              class="field__ico"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            <input
              id="email"
              formControlName="email"
              type="email"
              class="field__input"
              placeholder="admin@happy2clean.com"
              autocomplete="email"
            />
          </div>
          <p *ngIf="emailCtrl.invalid && emailCtrl.touched" class="field__msg">
            Please enter a valid email address
          </p>
        </div>

        <!-- Password -->
        <div
          class="field"
          [class.field--invalid]="passwordCtrl.invalid && passwordCtrl.touched"
        >
          <label class="field__label" for="password">Password</label>
          <div class="field__wrap">
            <svg
              class="field__ico"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input
              id="password"
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              class="field__input"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="field__eye"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="
                showPassword ? 'Hide password' : 'Show password'
              "
            >
              <svg
                *ngIf="!showPassword"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg
                *ngIf="showPassword"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
          <p
            *ngIf="passwordCtrl.invalid && passwordCtrl.touched"
            class="field__msg"
          >
            Password must be at least 6 characters
          </p>
        </div>

        <!-- Submit — only disabled while the request is in flight -->
        <button type="submit" class="submit-btn" [disabled]="loading">
          <span *ngIf="!loading">Sign in to Admin Portal</span>
          <span *ngIf="loading" class="btn-loading">
            <span class="btn-spinner"></span>
            Authenticating…
          </span>
        </button>
      </form>

      <div class="demo-box">
        <span class="demo-box__label">Demo</span>
        <span class="demo-box__creds"
          >admin&#64;happy2clean.com &nbsp;/&nbsp; password123</span
        >
      </div>
    </div>
  </main>
</div>
