<div class="app-shell">

  <!-- ── Top header ── -->
  <header class="top-bar">
    <div class="top-bar__brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">Happy2Clean</div>
        <div class="brand-sub">WORKER</div>
      </div>
    </div>

    <div class="top-bar__right">
      <span *ngIf="profile?.isOnline" class="online-dot"></span>
      <div class="header-avatar" [routerLink]="'/profile'">{{ getInitials() }}</div>
    </div>
  </header>

  <!-- ── Main content ── -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- ── Bottom navigation ── -->
  <nav class="bottom-nav" aria-label="App navigation">
    <a *ngFor="let tab of tabs"
       [routerLink]="tab.path"
       class="nav-tab"
       [class.active]="isActive(tab.path)"
       [attr.aria-label]="tab.label">
      <span class="nav-tab__icon" [attr.data-icon]="isActive(tab.path) ? tab.activeIcon : tab.icon"></span>
      <span class="nav-tab__label">{{ tab.label }}</span>
    </a>
  </nav>

</div>
