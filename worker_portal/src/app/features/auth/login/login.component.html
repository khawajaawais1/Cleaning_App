<div class="login-shell">

  <!-- Left / top decorative panel -->
  <div class="hero-panel">
    <div class="hero-glow"></div>
    <div class="hero-content">
      <div class="hero-logo">
        <div class="logo-mark"></div>
      </div>
      <h1 class="hero-title">Happy2Clean</h1>
      <p class="hero-tagline">Worker Portal</p>
      <p class="hero-desc">Manage your jobs, track earnings<br>and grow your career.</p>
    </div>
    <div class="hero-shapes">
      <span class="shape shape-1"></span>
      <span class="shape shape-2"></span>
      <span class="shape shape-3"></span>
    </div>
  </div>

  <!-- Form panel -->
  <div class="form-panel">
    <div class="form-inner">

      <div class="form-header">
        <h2 class="form-title">Welcome back</h2>
        <p class="form-subtitle">Sign in to your worker account</p>
      </div>

      <!-- Error banner -->
      <div *ngIf="error" class="error-banner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {{ error }}
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate autocomplete="on">

        <!-- Email -->
        <div class="field" [class.field--error]="isInvalid('email')" [class.field--filled]="form.get('email')?.value">
          <label class="field__label">Email address</label>
          <div class="field__wrap">
            <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input
              formControlName="email"
              type="email"
              class="field__input"
              placeholder="your@email.com"
              autocomplete="email"
              inputmode="email"
            />
          </div>
          <p *ngIf="isInvalid('email')" class="field__error">Please enter a valid email address</p>
        </div>

        <!-- Password -->
        <div class="field" [class.field--error]="isInvalid('password')" [class.field--filled]="form.get('password')?.value">
          <label class="field__label">Password</label>
          <div class="field__wrap">
            <svg class="field__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              class="field__input"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button type="button" class="field__toggle" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword"  width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p *ngIf="isInvalid('password')" class="field__error">Password is required</p>
        </div>

        <!-- Submit -->
        <button type="submit" class="submit-btn" [disabled]="loading">
          <span *ngIf="!loading" class="submit-btn__text">
            Sign in
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </span>
          <span *ngIf="loading" class="submit-btn__loading">
            <span class="btn-spinner"></span>
            Signing in…
          </span>
        </button>

      </form>

      <p class="switch-prompt">
        New to Happy2Clean?
        <a routerLink="/signup" class="switch-link">Apply as a worker</a>
      </p>

      <!-- Demo credentials -->
      <div class="demo-box">
        <p class="demo-box__label">Demo credentials</p>
        <p class="demo-box__creds">worker&#64;happy2clean.com &nbsp;·&nbsp; worker123</p>
      </div>

    </div>
  </div>

</div>
